
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Journal Pro</title>
    <meta name="description" content="Электронный журнал и дневник образовательного учреждения">
    <meta property="og:title" content="E-Journal Pro">
    <meta property="og:description" content="Электронный журнал и дневник образовательного учреждения">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="E-Journal">
    <link rel="icon" type="image/png" href="./assets/icon.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { 
                sans: ['var(--font-body, "Inter")', 'sans-serif'],
                display: ['var(--font-heading, "Inter")', 'sans-serif']
            },
            boxShadow: {
                'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                'glow': '0 0 15px rgba(59, 130, 246, 0.5)'
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --font-body: 'Inter';
            --font-heading: 'Inter';
            --snow-color: #bae6fd; /* Light blue for light mode */
        }
        
        .dark {
            --snow-color: #ffffff; /* White for dark mode */
        }

        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: var(--font-heading), sans-serif !important;
        }
        
        body {
            font-family: var(--font-body), sans-serif !important;
        }

        /* Table Headers Centering */
        th, td { vertical-align: middle; }
        
        /* Global Centering Utility for specific tables */
        .text-center-all th, .text-center-all td { text-align: center !important; }

        /* Larger Calendar Icon & Theme Adaptation */
        input[type="date"] {
            color-scheme: light; /* Force light scheme icons by default for visibility */
        }
        .dark input[type="date"] {
            color-scheme: dark; /* Force dark scheme icons in dark mode */
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            width: 24px;
            height: 24px;
            margin-left: 8px;
            padding: 2px;
            opacity: 0.8;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        
        /* Custom Scrollbar for Light & Dark Themes */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        /* Drag and Drop styling */
        .dragging-row {
            opacity: 0.5;
            background-color: #f0f9ff;
        }
        .dark .dragging-row {
            opacity: 0.5;
            background-color: #1e293b;
        }
        .dragging-over {
            border-top: 2px solid #3b82f6;
        }

        /* Blink animation for search results */
        @keyframes blink {
            0% { background-color: rgba(59, 130, 246, 0.3); }
            50% { background-color: rgba(59, 130, 246, 0.1); }
            100% { background-color: transparent; }
        }
        .highlight-blink {
            animation: blink 2s ease-out;
        }

        /* --- UI ANIMATIONS (Polyfill for tailwindcss-animate) --- */
        .animate-in { animation-duration: 0.2s; animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-top-1 { animation-name: slideInFromTop1; }
        .slide-in-from-top-2 { animation-name: slideInFromTop2; }
        .slide-in-from-bottom-2 { animation-name: slideInFromBottom2; }
        .slide-in-from-bottom { animation-name: slideInFromBottom; }
        .zoom-in { animation-name: zoomIn; }
        .zoom-in-95 { animation-name: zoomIn95; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInFromTop1 { from { transform: translateY(-0.25rem); } to { transform: translateY(0); } }
        @keyframes slideInFromTop2 { from { transform: translateY(-0.5rem); } to { transform: translateY(0); } }
        @keyframes slideInFromBottom2 { from { transform: translateY(0.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInFromBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes zoomIn95 { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- ADVANCED SEASONAL ANIMATIONS --- */
        
        .season-element {
            position: fixed;
            pointer-events: none;
            z-index: 50; /* Front overlay */
            user-select: none;
            will-change: transform, opacity, bottom, left;
        }

        /* 1. WINTER: Snow Only */
        @keyframes fall-rotate {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .season-snowflake {
            color: var(--snow-color);
            animation-name: fall-rotate;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
            top: 0;
        }

        /* 2. SPRING: Sakura Petals */
        @keyframes petal-fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg) scale(0.5); opacity: 0; }
        }
        .season-petal {
            position: fixed;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            border-radius: 15px 0px 15px 0px;
            pointer-events: none;
            z-index: 50;
            animation: petal-fall linear infinite;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
        }

        /* 3. SUMMER: Floating Pollen / Dandelion Seeds */
        @keyframes pollen-float {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(80px) rotate(360deg); opacity: 0; }
        }
        .season-pollen {
            position: fixed;
            background: radial-gradient(circle, rgba(255, 255, 100, 1) 0%, rgba(255, 255, 0, 0.8) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: pollen-float linear infinite;
            box-shadow: 0 0 12px rgba(255, 255, 0, 1);
        }
        .season-summer-leaf {
            position: fixed;
            background: linear-gradient(135deg, #86efac 0%, #22c55e 100%);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 50;
            animation: pollen-float linear infinite;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
        }

        /* 4. AUTUMN: Falling CSS Leaves */
        @keyframes autumn-fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(110vh) translateX(150px) rotate(720deg) scale(0.8); opacity: 0; }
        }
        .season-autumn-leaf {
            position: fixed;
            background: linear-gradient(135deg, var(--leaf-color-1) 0%, var(--leaf-color-2) 100%);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 50;
            animation: autumn-fall linear infinite;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .season-autumn-leaf::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50% 0 50% 0;
            background: linear-gradient(to bottom right, transparent 48%, rgba(0,0,0,0.15) 49%, transparent 51%);
        }

        /* --- REDUCED MOTION PREFERENCE --- */
        @media (prefers-reduced-motion: reduce) {
            .season-element,
            .season-snowflake,
            .season-petal,
            .season-pollen,
            .season-summer-leaf,
            .season-autumn-leaf {
                display: none !important;
                animation: none !important;
            }
            * {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* --- BEAUTIFUL PRINT STYLES (A4 Optimized & Ink Friendly) --- */
        @media print {
            @page {
                size: A4 auto;
                margin: 8mm;
            }
            @page landscape {
                size: A4 landscape;
                margin: 8mm;
            }
            @page portrait {
                size: A4 portrait;
                margin: 8mm;
            }
            .print-landscape { page: landscape; }
            .print-portrait { page: portrait; }

            *, *:before, *:after {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }

            body, html { 
                background: #ffffff !important; 
                color: #000000 !important; 
                font-size: 9pt !important;
                width: 100% !important;
                height: auto !important;
                min-height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            /* Hide UI Elements */
            .no-print, 
            header, 
            footer, 
            nav, 
            button, 
            .lucide, 
            input[type="file"],
            input[type="checkbox"]:not(.print-show),
            input[type="range"],
            .tab-button, 
            select:not(.print-show), 
            .season-element, 
            .season-petal, 
            .season-pollen, 
            .season-autumn-leaf, 
            .season-snowflake { 
                display: none !important; 
            }
            
            /* Reset Layout Containers */
            #root, main, .max-w-7xl, .max-w-5xl, .max-w-4xl {
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: transparent !important;
                overflow: visible !important;
            }
            
            /* Remove sticky and relative positioning for print so cell PaintLayers never paint over collapsed borders */
            .sticky, [class*="sticky"], table, thead, tbody, tfoot, tr, th, td {
                position: static !important;
                left: auto !important;
                right: auto !important;
                top: auto !important;
                bottom: auto !important;
                z-index: auto !important;
            }

            /* Ensure text contrast in print */
            .text-white, .text-slate-100, .text-slate-200, .text-slate-300, .text-slate-400 {
                color: #0f172a !important;
            }
            .bg-slate-900, .bg-slate-950, .bg-slate-800, .bg-slate-700 {
                background: #f8fafc !important;
                color: #0f172a !important;
            }

            /* Remove decorative and sticky column shadows */
            .shadow-soft, .shadow-glow, .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl, [class*="shadow"] {
                box-shadow: none !important;
            }

            /* Modals handling if printing from active modal */
            body.modal-open #root {
                display: none !important;
            }
            body.modal-open .modal-print-wrapper {
                position: static !important;
                width: 100% !important;
                height: auto !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                backdrop-filter: none !important;
                overflow: visible !important;
            }
            body.modal-open .modal-print-content {
                position: static !important;
                width: 100% !important;
                max-width: 100% !important;
                max-height: none !important;
                height: auto !important;
                box-shadow: none !important;
                border: none !important;
                background: transparent !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            body.modal-open .modal-print-body {
                overflow: visible !important;
                max-height: none !important;
                height: auto !important;
                padding: 0 !important;
            }

            /* --- CAPACIOUS TABLE STYLING --- */
            .overflow-x-auto, .overflow-y-auto, .overflow-hidden, .overflow-auto {
                overflow: visible !important;
                max-height: none !important;
            }

            table, [class*="min-w-"] {
                min-width: 0 !important;
                max-width: 100% !important;
            }

            table {
                width: 100% !important;
                border-collapse: collapse !important;
                border-spacing: 0 !important;
                border: 1pt solid #64748b !important;
                margin-top: 4px !important;
                margin-bottom: 10px !important;
                font-size: 8pt !important;
                table-layout: auto !important;
            }
            table.table-fixed {
                table-layout: fixed !important;
            }
            
            th, td { 
                border: 1pt solid #94a3b8 !important; 
                padding: 3px 5px !important;
                color: #0f172a !important;
                background-color: transparent !important;
                background: transparent !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
                vertical-align: middle !important;
                height: auto !important;
                box-shadow: none !important;
            }

            th {
                background-color: #f1f5f9 !important;
                color: #0f172a !important;
                font-weight: 700 !important;
                font-size: 7.5pt !important;
                letter-spacing: 0.01em;
                border: 1pt solid #64748b !important;
            }

            thead { display: table-header-group !important; }
            tr, .print-break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Fix inputs/selects in tables to look like text */
            input, select, textarea {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                min-width: 0 !important;
                height: auto !important;
                box-shadow: none !important;
                font-weight: 700 !important;
                text-align: center !important;
                color: #0f172a !important;
                font-size: 8.5pt !important;
                -webkit-appearance: none !important;
                appearance: none !important;
            }
            
            input::placeholder {
                color: transparent !important;
            }

            /* Remove dropdown arrows */
            select { 
                background-image: none !important; 
                -moz-appearance: none !important;
                text-indent: 0.01px;
                text-overflow: '';
                color: black !important;
                font-weight: bold !important;
            }

            /* Ensure Title of Day is bold and clearly separated */
            .font-bold { font-weight: bold !important; }

            /* Special handling for marks color */
            .text-green-600, .text-blue-600, .text-amber-600, .text-red-600 {
                font-weight: 700 !important;
            }
            
            /* Links */
            a { text-decoration: none !important; color: black !important; }
        }

        /* Global Mobile & Utility Styles */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }
        @media screen {
            html.modal-open, body.modal-open {
                overflow: hidden !important;
                overscroll-behavior: none !important;
            }
            body.modal-open #root {
                pointer-events: none !important;
                user-select: none !important;
            }
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .text-center-all th, .text-center-all td, .text-center-all input, .text-center-all select {
            text-align: center;
        }

        /* Basic Rich Text Styles for Quill */
        .ql-editor h1 { font-size: 2em; font-weight: bold; margin-bottom: 0.5em; }
        .ql-editor h2 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
        .ql-editor h3 { font-size: 1.17em; font-weight: bold; margin-bottom: 0.5em; }
        .ql-editor p { margin-bottom: 1em; }
        .ql-editor ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .ql-editor ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .ql-editor a { color: #3b82f6; text-decoration: underline; }
        .ql-editor img { max-width: 100%; height: auto; }
        .ql-editor blockquote { border-left: 4px solid #ccc; padding-left: 1em; margin-bottom: 1em; color: #666; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
